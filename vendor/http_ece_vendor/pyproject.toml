[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "http-ece"
version = "1.2.1"
description = "Vendored copy of http-ece (RFC 8188 aes128gcm), bundled directly in this repo because PyPI only ships a legacy sdist whose setup.py fails to build under modern setuptools (AttributeError: install_layout)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["cryptography"]

[tool.setuptools]
packages = ["http_ece"]
