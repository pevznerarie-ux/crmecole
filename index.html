<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CRM Sinaï</title>
    <meta name="description" content="CRM interne des institutions Sinaï : contacts, dons et interactions." />
    <meta name="theme-color" content="#f7f8fb" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM Sinaï" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="splash" class="splash" aria-hidden="true">
      <div class="splash-sparkles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="splash-logo"><img src="./assets/logo-sinai.png" alt="Les Institutions Sinaï" /></div>
      <p class="splash-tagline"><span id="splashTagline"></span><span class="splash-cursor">|</span></p>
    </div>
    <div id="authScreen" class="auth-screen"></div>
    <div class="app-shell">
      <div class="nav-scrim" id="navScrim"></div>
      <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <div class="brand">
          <div class="brand-logo-plate"><img src="./assets/logo-sinai.png" alt="Les Institutions Sinaï" /></div>
          <p class="brand-motto">Chaque famille compte.<br>Chaque geste fait grandir Sinaï.</p>
        </div>
        <nav id="nav"></nav>
        <div class="sidebar-actions">
          <button class="top-btn" id="dupBtnMobile" type="button">Doublons</button>
          <button class="top-btn" id="importBtnMobile" type="button">Importer</button>
          <button class="top-btn" id="exportBtnMobile" type="button">Exporter</button>
        </div>
        <div class="sidebar-card" id="profileCard">
          <span class="eyebrow">Profil</span>
          <strong>Profil administrateur</strong>
          <p>Accès lecture, modification, export, paramétrage, paiements et reçus fiscaux.</p>
        </div>
        <button type="button" class="logout-btn" id="logoutBtn">Se déconnecter</button>
      </aside>

      <main>
        <header class="topbar">
          <div class="topbar-top">
            <button class="icon-btn nav-toggle" id="navToggle" title="Menu" aria-label="Ouvrir le menu">☰</button>
            <div>
              <h1 id="viewTitle">Accueil</h1>
              <p id="viewSubtitle">CRM personnalisé pour Les institutions Sinaï.</p>
            </div>
          </div>
          <div class="top-actions">
            <button class="top-btn" title="Recherche de doublons" id="dupBtn">Doublons</button>
            <button class="top-btn" title="Import de contacts" id="importBtn">Importer</button>
            <button class="top-btn" title="Export CSV" id="exportBtn">Exporter</button>
            <button class="primary-btn" id="newRecordBtn">Ajouter</button>
          </div>
        </header>

        <section id="content" class="content"></section>
      </main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation mobile">
      <button type="button" class="bnav-btn" id="bnavHome" data-bnav="home" aria-label="Accueil">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
        <span>Accueil</span>
      </button>
      <button type="button" class="bnav-btn" id="bnavContacts" data-bnav="contacts" aria-label="Contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.4 3-5.2 5.5-5.2s4.9 1.8 5.5 5.2"/><circle cx="17" cy="9" r="2.4"/><path d="M15.8 13.4c2 .3 3.6 1.8 4.1 4.4"/></svg>
        <span>Contacts</span>
      </button>
      <button type="button" class="bnav-btn bnav-menu" id="bnavMenu" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button type="button" class="bnav-btn" id="bnavPayments" data-bnav="payments" aria-label="Paiements">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.3"/><path d="M14.9 8.7a4 4 0 1 0 0 6.6"/><path d="M7.3 10.3h6M7.3 13.3h5"/></svg>
        <span>Dons</span>
      </button>
      <button type="button" class="bnav-btn" id="bnavInteractions" data-bnav="interactions" aria-label="Interactions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="11" rx="3"/><path d="M8 15.5v3.3l4.2-3.3"/></svg>
        <span>Suivi</span>
      </button>
    </nav>
    <div class="fab-scrim" id="fabScrim"></div>
    <div class="fab-menu" id="fabMenu"></div>
    <button class="fab" id="fabAdd" title="Ajouter" aria-label="Ajouter">+</button>
    <div id="drawer" class="drawer" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="saveIndicator" class="save-indicator" aria-live="polite"></div>

    <dialog id="recordDialog">
      <div id="dialogContent"></div>
    </dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./sample-contacts.js"></script>
    <script src="./app.js"></script>
    <script src="./splash.js"></script>
  </body>
</html>
