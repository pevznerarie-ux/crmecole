<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Applique le thème clair/sombre mémorisé AVANT le premier affichage
         de la page (sinon on verrait un bref flash du thème par défaut avant
         que app.js, chargé en bas de page, n'ait le temps de le corriger). -->
    <script>
      try {
        var t = localStorage.getItem("crm-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>CRM Sinaï</title>
    <meta name="description" content="CRM interne des institutions Sinaï : contacts, dons et interactions." />
    <meta name="theme-color" content="#f4f4f6" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRM Sinaï" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="booting">
    <div id="authScreen" class="auth-screen"></div>
    <div class="app-shell">
      <div class="nav-scrim" id="navScrim"></div>
      <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
        <div class="brand"><img src="./assets/logo-sinai.png" alt="Les Institutions Sinaï" /></div>
        <button type="button" class="search-trigger" id="searchTrigger">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
          <span>Rechercher…</span><kbd>Ctrl K</kbd>
        </button>
        <nav id="nav"></nav>
        <button type="button" class="account-card" id="profileCard" data-menu="account" aria-label="Mon compte"></button>
      </aside>

      <main class="main">
        <header class="topbar">
          <button type="button" class="icon-btn nav-toggle" id="navToggle" title="Menu" aria-label="Ouvrir le menu">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="topbar-title">
            <h1 id="viewTitle"></h1>
            <p id="viewSubtitle"></p>
          </div>
          <div class="top-actions">
            <button type="button" class="icon-btn search-mobile" id="searchTriggerMobile" title="Rechercher" aria-label="Rechercher">
              <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            </button>
            <button type="button" class="primary-btn" id="newRecordBtn" data-menu="new">
              <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              Nouveau
            </button>
          </div>
        </header>

        <section id="content" class="content"></section>
      </main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation mobile">
      <button type="button" class="bnav-btn" id="bnavHome" data-bnav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>
        <span>Accueil</span>
      </button>
      <button type="button" class="bnav-btn" id="bnavContacts" data-bnav="contacts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.8c2 .7 3.2 2.4 3.6 5.2"/></svg>
        <span>Contacts</span>
      </button>
      <button type="button" class="bnav-add" id="bnavAdd" data-menu="new" aria-label="Ajouter">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" class="bnav-btn" id="bnavPayments" data-bnav="payments">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.3A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.6c0 5.7-7.5 10.3-7.5 10.3Z"/></svg>
        <span>Collecte</span>
      </button>
      <button type="button" class="bnav-btn" id="bnavMenu" aria-label="Ouvrir le menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        <span>Menu</span>
      </button>
    </nav>

    <div class="drawer-scrim" id="drawerScrim" data-action="close-drawer"></div>
    <div id="drawer" class="drawer" aria-live="polite"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="saveIndicator" class="save-indicator" aria-live="polite"></div>

    <dialog id="recordDialog">
      <div id="dialogContent"></div>
    </dialog>
    <dialog id="askDialog" class="ask-dialog"></dialog>
    <dialog id="paletteDialog" class="palette-dialog"></dialog>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="./sample-contacts.js"></script>
    <script src="./app.js"></script>
    <script src="./app-views.js"></script>
    <script src="./app-tools.js"></script>
  </body>
</html>
